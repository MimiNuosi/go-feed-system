global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: go-feed-system
    environment: local

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: go-feed-system-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - api-1:8080
          - api-2:8080
