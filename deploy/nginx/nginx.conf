worker_processes auto;

events {
    worker_connections 4096;
}

http {
    map $http_x_request_id $request_id_value {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format main '$remote_addr - $request_id_value "$request" '
                    '$status $body_bytes_sent upstream=$upstream_addr '
                    'response_time=$request_time';

    access_log /var/log/nginx/access.log main buffer=64k flush=1s;
    error_log /var/log/nginx/error.log warn;

    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream api_backend {
        zone api_backend 64k;
        least_conn;
        server api-1:8080 resolve max_fails=3 fail_timeout=5s;
        server api-2:8080 resolve max_fails=3 fail_timeout=5s;
        keepalive 128;
    }

    server {
        listen 80;
        server_name _;

        # 视频普通上传和分片上传都可能超过 Nginx 默认的 1MB。
        client_max_body_size 512m;
        client_body_timeout 60s;

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id_value;

            # SSE 必须实时下发，不能被 Nginx 攒在缓冲区。
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;

            proxy_connect_timeout 1s;
            proxy_send_timeout 1h;
            proxy_read_timeout 1h;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 3s;
        }
    }
}
