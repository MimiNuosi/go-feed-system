name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal pkg deploy)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build commands
        run: go build ./cmd/...

      - name: Validate deployment configuration
        run: go test -count=1 ./deploy/prometheus ./deploy/grafana ./deploy/ci
